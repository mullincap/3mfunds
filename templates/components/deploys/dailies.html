{% extends 'layouts/base.html' %}
{% block content %}

<div class="container-fluid">
  <div class="card custom-card">
    <div class="card-header">
      <div class="card-title"> Daily Performance </div>
    </div>

    <div class="card-body">

      <div id="gamma-ltv-chart" style="height: 600px;"></div>


      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-nowrap">
          <thead>
            <tr>
              <th>Date</th>
              <th>Equity Before</th>
              <th>Invested</th>
              <th>PnL</th>
              <th>Cum PnL</th>
              <th>Return</th>
              <th>Equity After</th>
              <th>Trade Bal</th>
              <th>Profit Bal</th>
            </tr>
          </thead>
          <tbody id="gamma-ltv-table-body">
            <tr><td colspan="8" class="text-center text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- APEX CHARTS JS -->
<script src="{{ url_for('static', filename='assets/libs/apexcharts/apexcharts.min.js') }}"></script>

<!-- CUSTOM JS -->
<script src="{{ url_for('static', filename='assets/js/gamma_ltv_chart.js') }}"></script>




{% endblock %}
